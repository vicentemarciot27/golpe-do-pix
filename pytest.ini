[pytest]
# Pytest configuration for Golpe do Pix

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Paths
testpaths = tests
pythonpath = .

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    # Coverage (commented out by default, uncomment to enable)
    # --cov=apps
    # --cov-report=term-missing
    # --cov-report=html

# Markers (defined in conftest.py but listed here for documentation)
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (slower, real dependencies)
    slow: Slow-running tests (> 5 seconds)
    requires_network: Tests requiring internet connection

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (requires pytest-timeout plugin)
# timeout = 300
# timeout_method = thread

# Parallel execution (requires pytest-xdist plugin)
# Run with: pytest -n auto
# addopts = -n auto

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

